<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Protocol Tech | Executive Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #07090f;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(12, 16, 26, 0.95);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.25);
            border-radius: 14px;
            padding: 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .avatar-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }
        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .role {
            font-size: 13px;
            color: #ff0055;
            margin-bottom: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .info-box {
            text-align: left;
            background: rgba(0, 255, 204, 0.04);
            border-left: 3px solid #00ffcc;
            padding: 10px 12px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #ccc;
            line-height: 1.6;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #00ffcc;
            color: #07090f;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            font-size: 14px;
        }
        .btn:hover {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            box-shadow: none;
        }
        .btn-outline:hover {
            background: #00ffcc;
            color: #07090f;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- প্রিমিয়াম লুকের প্রোফাইল ছবি -->
        <div class="avatar-container">
            <img src="1000220314.jpg" alt="Master Rakib" class="avatar">
        </div>
        
        <h1>Ghost Protocol Tech</h1>
        <div class="role">Lead Architect & Founder</div>

        <div class="info-box">
            ⚡ <b>Core Expertise:</b> Telegram Automation Bots, Full-Stack Web Apps & OSINT Tools.<br>
            🚀 <b>Status:</b> Systems Online & Secured.
        </div>

        <!-- সরাসরি টেলিগ্রামে মেসেজ দেওয়ার বাটন -->
        <a href="https://t.me/kinji_hakari1" target="_blank" class="btn">💬 Direct Message on Telegram</a>
        <a href="https://t.me/Ghost_Protocol_Tech" target="_blank" class="btn btn-outline">📢 Official Tech Channel</a>
    </div>

</body>
</html>
