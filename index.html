<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Protocol Tech | Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #07090f;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: rgba(12, 16, 26, 0.95);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
            border-radius: 12px;
            padding: 20px;
            max-width: 440px;
            width: 100%;
        }
        .header {
            text-align: center;
            border-bottom: 1px dashed #00ffcc;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 18px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        .role {
            font-size: 12px;
            color: #ff0055;
            font-weight: bold;
            margin-top: 3px;
        }
        .section-title {
            font-size: 13px;
            color: #00ffcc;
            margin-bottom: 8px;
            text-transform: uppercase;
            border-left: 3px solid #ff0055;
            padding-left: 6px;
        }
        .tool-card {
            background: rgba(0, 255, 204, 0.03);
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tool-info h3 {
            font-size: 13px;
            color: #fff;
        }
        .tool-info p {
            font-size: 11px;
            color: #888;
        }
        .btn-sm {
            background: #00ffcc;
            color: #07090f;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            transition: 0.2s;
        }
        .btn-sm:hover {
            background: #ff0055;
            color: #fff;
        }
        .footer-btns {
            margin-top: 15px;
            text-align: center;
        }
        .btn-full {
            display: block;
            width: 100%;
            padding: 10px;
            background: #00ffcc;
            color: #07090f;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            font-size: 13px;
            margin-top: 8px;
        }
        .btn-full:hover {
            background: #ff0055;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Profile Info -->
        <div class="header">
            <h1>Ghost Protocol Tech</h1>
            <div class="role">Lead Architect & Full-Stack Developer</div>
        </div>

        <!-- Featured Tools / Projects Section -->
        <div class="section-title">Active Deployments & Tools</div>
        
        <div class="tool-card">
            <div class="tool-info">
                <h3>⚡ Ghost Super Bot</h3>
                <p>Modular Telegram Automation & OSINT</p>
            </div>
            <a href="https://t.me/kinji_hakari1" target="_blank" class="btn-sm">Access</a>
        </div>

        <div class="tool-card">
            <div class="tool-info">
                <h3>🌐 Cyber Web Toolkit</h3>
                <p>Full-stack mobile web apps & APIs</p>
            </div>
            <a href="https://t.me/Ghost_Protocol_Tech" target="_blank" class="btn-sm">View</a>
        </div>

        <!-- Direct Contact Actions -->
        <div class="footer-btns">
            <a href="https://t.me/kinji_hakari1" target="_blank" class="btn-full">💬 Direct Contact on Telegram</a>
        </div>
    </div>

</body>
</html>
